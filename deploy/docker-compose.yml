services:
  laminara:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: laminara/laminara-server:latest
    restart: unless-stopped
    command: ["start", "--config", "/etc/laminara/config.json"]
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - ./config.json:/etc/laminara/config.json:ro
      - laminara-data:/var/lib/laminara
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Enable only if the auth adapter reads from a database you host here.
  # postgres:
