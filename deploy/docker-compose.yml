  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

  # Self-hosted S3 (recommended for scale). The install script can wire this up;
  # see docs/guide/storage.md for Garage / SeaweedFS / Backblaze B2.
  # garage:
