# Заголовки безопасности для статического лендинга laminara.dev.
# Подключите в блок server {} сайта: include /path/to/security-headers.conf;
# CSP продублирован в <meta> внутри index.html, здесь он полнее (добавляет
# frame-ancestors, который через <meta> не работает). HSTS включайте только
# когда сайт уже под TLS и назад на http возвращаться не планируется.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
