upstream laminara {
    server 127.0.0.1:8099;
    keepalive 32;
}

server {
    listen 80;
    server_name launcher.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 off;
    server_name launcher.example.com;

    ssl_certificate     /etc/letsencrypt/live/launcher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.example.com/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://laminara;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Раздача файлов при файловом хранилище. На запрос /objects/<ключ> сервер
    # отвечает заголовком X-Accel-Redirect: /internal-objects/<ключ>, и байты
    # отдаёт nginx через sendfile, не пропуская их через процесс сервера.
    # alias должен указывать на корень хранилища.
    location /internal-objects/ {
        internal;
        alias /var/lib/laminara/objects/;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}
