name: Проверка контейнера и Helm

on:
  push:
    branches: [main]
    paths: ["deploy/**", "server/**", "proto/**", "sdk/go/**", "go.mod", "go.sum", "VERSION", "buf*.yaml", ".github/workflows/deployment-check.yml"]
  pull_request:
    paths: ["deploy/**", "server/**", "proto/**", "sdk/go/**", "go.mod", "go.sum", "VERSION", "buf*.yaml", ".github/workflows/deployment-check.yml"]

permissions:
  contents: read

concurrency:
  group: deployment-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: laminara:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Проверить бинарь
        run: docker run --rm laminara:check version
      - name: Helm
        run: |
          curl -fsSLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.1-linux-amd64.tar.gz
          version=$(tr -d '[:space:]' < VERSION)
          ./linux-amd64/helm lint deploy/helm/laminara --set-string image.tag="$version"
          ./linux-amd64/helm template check deploy/helm/laminara --set-string image.tag="$version" > /tmp/laminara.yaml
          ./linux-amd64/helm template check deploy/helm/laminara --set-string image.tag="$version" --set existingConfigSecret=config --set persistence.existingClaim=data --set ingress.enabled=true --set ingress.host=example.com --set ingress.tlsSecret=tls > /tmp/laminara-external.yaml
          if ./linux-amd64/helm template check deploy/helm/laminara --set-string image.tag="$version" --set replicaCount=2; then exit 1; fi
          if ./linux-amd64/helm template check deploy/helm/laminara; then exit 1; fi
