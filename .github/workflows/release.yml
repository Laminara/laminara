name: Релиз

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Версия
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Прочитать версию
        id: read
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ -z "$version" ]; then
            echo "файл VERSION пуст" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Версия $version уже выпущена, релиз пропущен"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Готовим релиз v$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Сборка
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - run: make generate

      - name: Собрать под linux
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/laminara/laminara/server/internal/version.Current=$VERSION" \
              -o "release/laminara-server-linux-$arch" ./server/cmd/laminara-server
          done
      - name: Проверить, что бинарь называет свою версию
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          got=$(./release/laminara-server-linux-amd64 version)
          echo "версия в бинаре: $got"
          [ "$got" = "$VERSION" ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: release/*
          if-no-files-found: error

  launcher:
    name: Лаунчер (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: laminara-launcher-linux-x86_64
            built: laminara
          - os: windows-2025
            artifact: laminara-launcher-windows-x86_64.exe
            built: laminara.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Системные библиотеки Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Иконка с запасом под свою картинку
        run: go run ./server/cmd/iconslots client/src-tauri/icons/128x128@2x.png client/src-tauri/icons/icon.ico

      - name: Собрать фронтенд
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Собрать лаунчер
        working-directory: client
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Сгенерировать контракты
        shell: bash
        run: |
          buf generate
          buf generate --template buf.gen.sdk.yaml

      - name: Проверить запекание на собранном лаунчере
        shell: bash
        env:
          LAMINARA_LAUNCHER_TEMPLATE: ${{ runner.os == 'Windows' && format('{0}/client/target/release/{1}', github.workspace, matrix.built) || '' }}
          LAMINARA_WINRES_EXE: ${{ runner.os == 'Windows' && format('{0}/client/target/release/{1}', github.workspace, matrix.built) || '' }}
        run: go test ./server/internal/winres/... ./server/internal/launchersvc/...

      - name: Разложить артефакт
        shell: bash
        run: |
          mkdir -p release
          cp "client/target/release/${{ matrix.built }}" "release/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Публикация
    needs: [version, build, launcher]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Посчитать контрольные суммы
        run: cd release && sha256sum laminara-* > checksums.txt && cat checksums.txt

      - name: Собрать список изменений
        id: changelog
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
          else
            range="HEAD"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            git log --no-merges --pretty='- %s' "$range"
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Laminara v${{ needs.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: release/*
          draft: false
          prerelease: false
