name: Шаблоны лаунчера

on:
  workflow_call:
    inputs:
      laminara-ref:
        description: Ревизия Laminara/laminara, из которой собирается лаунчер
        type: string
        required: true
      skin-repository:
        description: Репозиторий со своим скином; пусто — скин по умолчанию
        type: string
        default: ""
      skin-ref:
        description: Ревизия репозитория скина
        type: string
        default: ""
      skin-path:
        description: Папка скина внутри его репозитория, где лежит main.slint
        type: string
        default: skin

jobs:
  launcher:
    name: Лаунчер (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: laminara-launcher-linux-x86_64
            built: laminara
          - os: windows-2025
            artifact: laminara-launcher-windows-x86_64.exe
            built: laminara.exe
          - os: macos-15
            artifact: laminara-launcher-macos-universal
            built: laminara
    env:
      LAMINARA_SKIN_DIR: ${{ inputs.skin-repository != '' && format('{0}/skin-source/{1}', github.workspace, inputs.skin-path) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Laminara/laminara
          ref: ${{ inputs.laminara-ref }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.skin-repository != ''
        with:
          repository: ${{ inputs.skin-repository }}
          ref: ${{ inputs.skin-ref }}
          path: skin-source

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Системные библиотеки окна
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client
          key: ${{ inputs.skin-repository }}

      - name: Иконка с запасом под свою картинку
        run: go run ./server/cmd/iconslots client/launcher/icons/128x128@2x.png client/launcher/icons/icon.ico

      - name: Собрать лаунчер
        if: runner.os != 'macOS'
        working-directory: client
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Собрать лаунчер под оба процессора Apple
        if: runner.os == 'macOS'
        working-directory: client
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path launcher/Cargo.toml --target "$target"
          done
          mkdir -p target/release
          lipo -create -output target/release/laminara \
            target/aarch64-apple-darwin/release/laminara \
            target/x86_64-apple-darwin/release/laminara
          codesign --force --sign - --entitlements launcher/macos.entitlements target/release/laminara
          codesign --verify --verbose target/release/laminara
          codesign -d --entitlements - target/release/laminara
          lipo -info target/release/laminara

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Сгенерировать контракты
        shell: bash
        run: |
          buf generate
          buf generate --template buf.gen.sdk.yaml

      - name: Проверить запекание на собранном лаунчере
        shell: bash
        env:
          LAMINARA_LAUNCHER_TEMPLATE: ${{ runner.os == 'Windows' && format('{0}/client/target/release/{1}', github.workspace, matrix.built) || '' }}
          LAMINARA_WINRES_EXE: ${{ runner.os == 'Windows' && format('{0}/client/target/release/{1}', github.workspace, matrix.built) || '' }}
        run: go test ./server/internal/winres/... ./server/internal/launchersvc/...

      - name: Проверить пакет для macOS на настоящем маке
        if: runner.os == 'macOS'
        env:
          LAMINARA_MACAPP_BINARY: ${{ github.workspace }}/client/target/release/laminara
        run: go test ./server/internal/macapp/... -run Mac -v

      - name: Разложить артефакт
        shell: bash
        run: |
          mkdir -p release
          cp "client/target/release/${{ matrix.built }}" "release/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
