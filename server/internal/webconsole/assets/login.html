<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Консоль Laminara</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1c1b19;
        color: #e8e4dd;
        font: 14px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      form {
        display: grid;
        gap: 12px;
        width: min(320px, 90vw);
      }
      b {
        color: #e0a458;
        font-size: 18px;
      }
      input,
      button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3a3733;
        background: #232120;
        color: inherit;
      }
      button {
        background: #e0a458;
        color: #1c1b19;
        border-color: transparent;
        font-weight: 600;
        cursor: pointer;
      }
      p {
        margin: 0;
        color: #8b857c;
      }
      p.wrong {
        color: #d98b5f;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/console/login">
      <b>Laminara</b>
      <p>Консоль сервера. Введите пароль или откройте ссылку, которую печатает команда <code>web</code>.</p>
      <input type="password" name="password" placeholder="Пароль" autofocus autocomplete="current-password" />
      <button type="submit">Войти</button>
      <p class="wrong" id="wrong"></p>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("wrong")) {
        document.getElementById("wrong").textContent = "Пароль не подошёл";
      }
    </script>
  </body>
</html>
