version: v2
inputs:
  - directory: proto
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/laminara/laminara/gen/go
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: gen/go
    opt: paths=source_relative
