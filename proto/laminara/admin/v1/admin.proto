syntax = "proto3";

package laminara.admin.v1;

import "laminara/core/v1/platform.proto";

message StatusRequest {}

message StatusResponse {
  string version = 1;
  int64 started_at_unix_nanos = 2;
  uint32 modules_loaded = 3;
  uint64 memory_bytes = 4;
  uint32 goroutines = 5;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogLine {
  int64 time_unix_nanos = 1;
  LogLevel level = 2;
  string source = 3;
  string message = 4;
  map<string, string> fields = 5;
}

message StreamLogsRequest {
  LogLevel min_level = 1;
  string source = 2;
  uint32 backscroll = 3;
  bool follow = 4;
}

message StreamLogsResponse {
  LogLine line = 1;
}

message ExecRequest {
  string line = 1;
}

message ExecOutputChunk {
  string text = 1;
  bool stderr = 2;
}

message ExecResult {
  int32 exit_code = 1;
}

message ExecProgress {
  string phase = 1;
  int64 current = 2;
  int64 total = 3;
  string message = 4;
}

message ExecResponse {
  oneof event {
    ExecOutputChunk output = 1;
    ExecResult result = 2;
    ExecProgress progress = 3;
  }
}

message ListVersionsRequest {
  string query = 1;
}

message VersionInfo {
  string id = 1;
  string type = 2;
}

message ListVersionsResponse {
  repeated VersionInfo versions = 1;
  string latest_release = 2;
  string latest_snapshot = 3;
}

message ListLoadersRequest {
  string mc_version = 1;
}

message LoaderInfo {
  string name = 1;
  repeated string versions = 2;
}

message ListLoadersResponse {
  repeated LoaderInfo loaders = 1;
}

message ListBuildsRequest {}

message BuildInfo {
  string name = 1;
  string status = 2;
  repeated laminara.core.v1.Platform prepared = 3;
  repeated laminara.core.v1.Platform published = 4;
  string minecraft_version = 5;
  string loader = 6;
  uint64 size_bytes = 7;
  uint32 files = 8;
  string server_address = 9;
  bool has_features = 10;
  int64 published_at_unix_nanos = 11;
  uint32 java_major = 12;
  string access = 13;
}

message ListBuildsResponse {
  repeated BuildInfo builds = 1;
}

message ListPlayersRequest {}

message BuildPlayers {
  string build = 1;
  string address = 2;
  bool reachable = 3;
  int64 online = 4;
  int64 max = 5;
  repeated string names = 6;
  string version = 7;
  string error = 8;
}

message ListPlayersResponse {
  repeated BuildPlayers builds = 1;
}

message SettingSection {
  string key = 1;
  string title = 2;
  string hint = 3;
}

message SettingEntry {
  string path = 1;
  string label = 2;
  string hint = 3;
  string kind = 4;
  string value = 5;
  string default_value = 6;
  bool is_set = 7;
  repeated string options = 8;
  string display = 9;
}

message SettingCollectionEntry {
  string path = 1;
  string title = 2;
}

message SettingCollection {
  string path = 1;
  string title = 2;
  string hint = 3;
  bool keyed = 4;
  string name_label = 5;
  string name_hint = 6;
  repeated SettingCollectionEntry entries = 7;
}

message ListSettingsRequest {
  string section = 1;
  string entry = 2;
}

message ListSettingsResponse {
  repeated SettingSection sections = 1;
  repeated SettingEntry entries = 2;
  repeated SettingCollection collections = 3;
  string config_path = 4;
  bool restart_pending = 5;
}

message SetSettingRequest {
  string path = 1;
  string value = 2;
}

message SetSettingResponse {
  SettingEntry entry = 1;
}

message AddSettingEntryRequest {
  string collection = 1;
  string name = 2;
}

message AddSettingEntryResponse {
  string path = 1;
}

message RemoveSettingEntryRequest {
  string path = 1;
}

message RemoveSettingEntryResponse {}

message RestartRequest {}

message RestartResponse {}

service AdminService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc ListLoaders(ListLoadersRequest) returns (ListLoadersResponse);
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);
  rpc AddSettingEntry(AddSettingEntryRequest) returns (AddSettingEntryResponse);
  rpc RemoveSettingEntry(RemoveSettingEntryRequest) returns (RemoveSettingEntryResponse);
  rpc Restart(RestartRequest) returns (RestartResponse);
}
