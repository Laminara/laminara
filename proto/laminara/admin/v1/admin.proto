syntax = "proto3";

package laminara.admin.v1;

import "laminara/core/v1/platform.proto";

message StatusRequest {}

message PlanBuildRequest { bytes specification_json = 1; }
message PlanBuildResponse {
  string revision = 1;
  string input_digest = 2;
  bool no_op = 3;
  repeated string missing_hashes = 4;
}
message UploadBuildChunkRequest {
  string sha256 = 1;
  uint64 size = 2;
  uint64 offset = 3;
  bytes data = 4;
}
message UploadBuildChunkResponse { uint64 offset = 1; bool complete = 2; }

message StopRequest {}

message StopResponse {}

message ListCommandsRequest {}

message CommandInfo {
  string name = 1;
  repeated string aliases = 2;
  string synopsis = 3;
  bool secret_arguments = 4;
  bool secret_output = 5;
}

message ListCommandsResponse {
  repeated CommandInfo commands = 1;
}

message StatusResponse {
  string version = 1;
  int64 started_at_unix_nanos = 2;
  uint32 modules_loaded = 3;
  uint64 memory_bytes = 4;
  uint32 goroutines = 5;
  repeated AdminCapability capabilities = 6;
}

enum AdminCapability {
  ADMIN_CAPABILITY_UNSPECIFIED = 0;
  ADMIN_CAPABILITY_STRUCTURED_ARGUMENTS = 1;
  ADMIN_CAPABILITY_REDACTED_SETTINGS = 2;
  ADMIN_CAPABILITY_SETTINGS_PATCH = 3;
  ADMIN_CAPABILITY_JOBS = 4;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogLine {
  int64 time_unix_nanos = 1;
  LogLevel level = 2;
  string source = 3;
  string message = 4;
  map<string, string> fields = 5;
}

message StreamLogsRequest {
  LogLevel min_level = 1;
  string source = 2;
  uint32 backscroll = 3;
  bool follow = 4;
}

message StreamLogsResponse {
  LogLine line = 1;
}

message ExecRequest {
  string line = 1;
  repeated string arguments = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_SUCCEEDED = 2;
  JOB_STATE_FAILED = 3;
  JOB_STATE_CANCELLED = 4;
  JOB_STATE_INTERRUPTED = 5;
}

message JobInfo {
  string id = 1;
  string command = 2;
  JobState state = 3;
  int64 created_at_unix_nanos = 4;
  int64 finished_at_unix_nanos = 5;
  int32 exit_code = 6;
  bool cancel_requested = 7;
  uint64 last_sequence = 8;
  bool output_truncated = 9;
}

message StartJobRequest {
  repeated string arguments = 1;
  string idempotency_key = 2;
}

message StartJobResponse { JobInfo job = 1; }
message GetJobRequest { string id = 1; }
message GetJobResponse { JobInfo job = 1; }
message ListJobsRequest {}
message ListJobsResponse { repeated JobInfo jobs = 1; }
message CancelJobRequest { string id = 1; }
message CancelJobResponse { JobInfo job = 1; }
message StreamJobRequest {
  string id = 1;
  uint64 after_sequence = 2;
}
message StreamJobResponse {
  uint64 sequence = 1;
  ExecResponse event = 2;
}

message ExecOutputChunk {
  string text = 1;
  bool stderr = 2;
}

message ExecResult {
  int32 exit_code = 1;
}

message ExecProgress {
  string phase = 1;
  int64 current = 2;
  int64 total = 3;
  string message = 4;
}

message ExecResponse {
  oneof event {
    ExecOutputChunk output = 1;
    ExecResult result = 2;
    ExecProgress progress = 3;
  }
}

message ListVersionsRequest {
  string query = 1;
}

message VersionInfo {
  string id = 1;
  string type = 2;
}

message ListVersionsResponse {
  repeated VersionInfo versions = 1;
  string latest_release = 2;
  string latest_snapshot = 3;
}

message ListLoadersRequest {
  string mc_version = 1;
}

message LoaderInfo {
  string name = 1;
  repeated string versions = 2;
  string trouble = 3;
}

message RecipeInfo {
  string name = 1;
  string summary = 2;
  string loader = 3;
}

message ListLoadersResponse {
  repeated LoaderInfo loaders = 1;
  repeated RecipeInfo recipes = 2;
}

message ListBuildsRequest {}

message BuildInfo {
  string name = 1;
  string status = 2;
  repeated laminara.core.v1.Platform prepared = 3;
  repeated laminara.core.v1.Platform published = 4;
  string minecraft_version = 5;
  string loader = 6;
  uint64 size_bytes = 7;
  uint32 files = 8;
  string server_address = 9;
  bool has_features = 10;
  int64 published_at_unix_nanos = 11;
  uint32 java_major = 12;
  string access = 13;
  string compat = 14;
  string trouble = 15;
  string settings_revision = 16;
  string published_settings_revision = 17;
  string install = 18;
  string source_revision = 19;
  string input_digest = 20;
  string release_id = 21;
  repeated string retained_releases = 22;
}

message ListBuildsResponse {
  repeated BuildInfo builds = 1;
}

message ListPlayersRequest {}

message BuildPlayers {
  string build = 1;
  string address = 2;
  bool reachable = 3;
  int64 online = 4;
  int64 max = 5;
  repeated string names = 6;
  string version = 7;
  string error = 8;
}

message ListPlayersResponse {
  repeated BuildPlayers builds = 1;
}

message SettingSection {
  string key = 1;
  string title = 2;
  string hint = 3;
}

message SettingEntry {
  string path = 1;
  string label = 2;
  string hint = 3;
  string kind = 4;
  string value = 5;
  string default_value = 6;
  bool is_set = 7;
  repeated string options = 8;
  string display = 9;
}

message SettingCollectionEntry {
  string path = 1;
  string title = 2;
}

message SettingCollection {
  string path = 1;
  string title = 2;
  string hint = 3;
  bool keyed = 4;
  string name_label = 5;
  string name_hint = 6;
  repeated SettingCollectionEntry entries = 7;
}

message ListSettingsRequest {
  string section = 1;
  string entry = 2;
}

message ListSettingsResponse {
  repeated SettingSection sections = 1;
  repeated SettingEntry entries = 2;
  repeated SettingCollection collections = 3;
  string config_path = 4;
  bool restart_pending = 5;
  string revision = 6;
  string active_revision = 7;
  string read_only_reason = 8;
}

message SettingChange {
  oneof action {
    SetSettingRequest set = 1;
    AddSettingEntryRequest add = 2;
    RemoveSettingEntryRequest remove = 3;
    SetSettingItemRequest item = 4;
  }
}

message SetSettingItemRequest {
  string path = 1;
  string key = 2;
  string value = 3;
  bool remove = 4;
}

message SettingsPatch {
  string revision = 1;
  repeated SettingChange changes = 2;
  string target_build = 3;
}

message SettingDifference {
  string path = 1;
  string before = 2;
  string after = 3;
}

message PreviewSettingsRequest {
  SettingsPatch patch = 1;
  string section = 2;
  string entry = 3;
  string query = 4;
}

message PreviewSettingsResponse {
  ListSettingsResponse page = 1;
  repeated SettingDifference differences = 2;
  string added_path = 3;
  string validation_error = 4;
}

message ApplySettingsRequest {
  SettingsPatch patch = 1;
}

message ApplySettingsResponse {
  string revision = 1;
}

message PreviewBuildSettingsRequest {
  string build = 1;
  PreviewSettingsRequest settings = 2;
}

message PreviewBuildSettingsResponse {
  PreviewSettingsResponse settings = 1;
}

message ApplyBuildSettingsRequest {
  string build = 1;
  SettingsPatch patch = 2;
}

message ApplyBuildSettingsResponse {
  string revision = 1;
}

message SetSettingRequest {
  string path = 1;
  string value = 2;
  SettingWriteMode mode = 3;
}

enum SettingWriteMode {
  SETTING_WRITE_MODE_UNSPECIFIED = 0;
  SETTING_WRITE_MODE_REPLACE = 1;
  SETTING_WRITE_MODE_EDIT_REDACTED = 2;
  SETTING_WRITE_MODE_CLEAR = 3;
  SETTING_WRITE_MODE_PASSWORD = 4;
}

message SetSettingResponse {
  SettingEntry entry = 1;
}

message AddSettingEntryRequest {
  string collection = 1;
  string name = 2;
}

message AddSettingEntryResponse {
  string path = 1;
}

message RemoveSettingEntryRequest {
  string path = 1;
}

message RemoveSettingEntryResponse {}

message RestartRequest {}

message RestartResponse {}

service AdminService {
  rpc PlanBuild(PlanBuildRequest) returns (PlanBuildResponse);
  rpc UploadBuildChunk(UploadBuildChunkRequest) returns (UploadBuildChunkResponse);
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc StreamJob(StreamJobRequest) returns (stream StreamJobResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc ListLoaders(ListLoadersRequest) returns (ListLoadersResponse);
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);
  rpc PreviewSettings(PreviewSettingsRequest) returns (PreviewSettingsResponse);
  rpc ApplySettings(ApplySettingsRequest) returns (ApplySettingsResponse);
  rpc PreviewBuildSettings(PreviewBuildSettingsRequest) returns (PreviewBuildSettingsResponse);
  rpc ApplyBuildSettings(ApplyBuildSettingsRequest) returns (ApplyBuildSettingsResponse);
  rpc AddSettingEntry(AddSettingEntryRequest) returns (AddSettingEntryResponse);
  rpc RemoveSettingEntry(RemoveSettingEntryRequest) returns (RemoveSettingEntryResponse);
  rpc Restart(RestartRequest) returns (RestartResponse);
}
