syntax = "proto3";

package laminara.core.v1;

import "laminara/core/v1/platform.proto";

enum HashAlgo {
  HASH_ALGO_UNSPECIFIED = 0;
  HASH_ALGO_BLAKE3 = 1;
  HASH_ALGO_SHA256 = 2;
  HASH_ALGO_SHA1 = 3;
}

message Hash {
  HashAlgo algo = 1;
  bytes value = 2;
}

message ObjectRef {
  Hash hash = 1;
  uint64 size = 2;
}

message ChunkRef {
  Hash hash = 1;
  uint64 offset = 2;
  uint64 size = 3;
}

enum FilePolicy {
  FILE_POLICY_UNSPECIFIED = 0;
  FILE_POLICY_USER_WRITABLE = 1;
  FILE_POLICY_ENFORCED = 2;
}

message ManifestFile {
  string path = 1;
  ObjectRef object = 2;
  bool executable = 3;
  repeated ChunkRef chunks = 4;
  FilePolicy policy = 5;
}

enum SelectionType {
  SELECTION_TYPE_UNSPECIFIED = 0;
  SELECTION_TYPE_SINGLE = 1;
  SELECTION_TYPE_MULTI = 2;
}

message OptionMeta {
  string icon = 1;
  string badge = 2;
  uint64 added_size = 3;
  repeated string requires = 4;
  repeated string incompatible_with = 5;
}

message FeatureOption {
  string id = 1;
  string title = 2;
  string description = 3;
  bool default_enabled = 4;
  repeated string files = 5;
  repeated FeatureGroup groups = 6;
  OptionMeta meta = 7;
  repeated string jvm_args = 8;
  repeated string game_args = 9;
  repeated string classpath = 10;
}

message FeatureGroup {
  string id = 1;
  string title = 2;
  string description = 3;
  SelectionType selection = 4;
  bool required = 5;
  repeated FeatureOption options = 6;
}

message FeatureModel {
  repeated FeatureGroup groups = 1;
}

message Manifest {
  uint32 schema_version = 1;
  string modpack = 2;
  string version = 3;
  int64 generated_at_unix_nanos = 4;
  repeated ManifestFile files = 5;
  uint64 total_size = 6;
  FetchTuning fetch_tuning = 7;
  MirrorList mirrors = 8;
  repeated string user_writable = 9;
  repeated string enforced = 10;
  string server_address = 11;
  string loader = 12;
  FeatureModel features = 13;
  Platform platform = 14;
  string minecraft_version = 15;
  uint32 java_major = 16;
}

message MirrorList {
  repeated string base_urls = 1;
}

message FetchTuning {
  uint32 chunk_size_bytes = 1;
  uint32 stall_floor_bps = 2;
  uint32 stall_window_seconds = 3;
  uint32 max_parallel = 4;
  uint32 max_parallel_per_host = 5;
  uint32 backoff_base_ms = 6;
}

enum LauncherArtifactKind {
  LAUNCHER_ARTIFACT_KIND_UNSPECIFIED = 0;
  LAUNCHER_ARTIFACT_KIND_RAW_EXECUTABLE = 1;
  LAUNCHER_ARTIFACT_KIND_APP_IMAGE = 2;
  LAUNCHER_ARTIFACT_KIND_APP_BUNDLE_TAR_GZ = 3;
  LAUNCHER_ARTIFACT_KIND_INSTALLER = 4;
}

message LauncherArtifact {
  Platform platform = 1;
  LauncherArtifactKind kind = 2;
  ObjectRef object = 3;
  string file_name = 4;
}

message LauncherRelease {
  uint32 schema_version = 1;
  string version = 2;
  int64 released_at_unix_nanos = 3;
  repeated LauncherArtifact artifacts = 4;
  string minimum_version = 5;
  string notes = 6;
}
