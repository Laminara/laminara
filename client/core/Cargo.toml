[package]
name = "laminara-launcher-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "laminara_core"
path = "src/lib.rs"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util", "time", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
blake3 = { version = "1", features = ["mmap"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
futures = "0.3"
bytes = "1"
url = "2"
arc-swap = "1"
tempfile = "3"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
same-file = "1.0.6"
reflink-copy = "0.1.30"
flate2 = "1.1.9"
tar = "0.4.46"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
dirs = "5"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"
