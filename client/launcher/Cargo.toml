[package]
name = "laminara"
version = "0.1.0"
edition = "2024"
description = "Laminara launcher"

[lib]
name = "laminara"
path = "src/lib.rs"

[[bin]]
name = "laminara"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[dependencies]
laminara-launcher-core = { path = "../core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030", "raw-window-handle-06"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "3.7.0", default-features = false }
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time"] }
tokio-util = "0.7"
futures = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
zeroize = "1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
csscolorparser = "0.9.1"
gif = "0.14.2"

[dev-dependencies]
tempfile = "3"
