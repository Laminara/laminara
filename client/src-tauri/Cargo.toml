[package]
name = "laminara"
version = "0.1.0"
edition = "2021"
description = "Laminara launcher"

[lib]
name = "laminara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Release builds serve the embedded dist; without it tauri falls back to devUrl.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
laminara-launcher-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process"] }
tokio-util = "0.7"
futures = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
zeroize = "1"
arc-swap = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri-plugin-dialog = "2.7.1"
